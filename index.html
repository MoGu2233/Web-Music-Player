<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 云音乐播放器</title>
<style>
/* ===== 浅色蓝白主题 ===== */
:root{
  --primary:#1a73e8;
  --primary-dark:#1557b0;
  --primary-light:#e8f0fe;
  --bg:#eef4ff;
  --card:#ffffff;
  --card-hover:#f5f9ff;
  --border:#dbe4f0;
  --text:#1e293b;
  --text-sub:#64748b;
  --text-light:#94a3b8;
  --shadow:0 2px 8px rgba(30,90,180,.08);
  --shadow-lg:0 8px 24px rgba(30,90,180,.15);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:linear-gradient(160deg,#e8f1ff 0%,#f2f7ff 50%,#e3edfd 100%);min-height:100vh;color:var(--text);display:flex;flex-direction:column;padding-bottom:120px}
.app{max-width:960px;margin:0 auto;width:100%;padding:20px 16px}

/* 头部 */
header h1{text-align:center;font-size:28px;margin:8px 0 18px;background:linear-gradient(90deg,#1a73e8,#4285f4,#64b5f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:12px 18px;border-radius:24px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none;transition:.3s;box-shadow:var(--shadow)}
.search-bar input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.search-bar input::placeholder{color:var(--text-light)}
.search-bar select{padding:12px 14px;border-radius:24px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;cursor:pointer;box-shadow:var(--shadow)}
.search-bar select optgroup{color:var(--text-sub)}
.search-bar button{padding:12px 26px;border-radius:24px;border:none;background:linear-gradient(135deg,#1a73e8,#4285f4);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:.3s;box-shadow:0 4px 14px rgba(26,115,232,.3)}
.search-bar button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(26,115,232,.4)}
.search-bar button:active{transform:scale(.96)}

/* 主体两栏 */
.main{display:flex;gap:16px}
.song-list{flex:1;display:flex;flex-direction:column;gap:8px;background:transparent;border-radius:16px;padding:4px;max-height:60vh;overflow-y:auto}
.song-list::-webkit-scrollbar{width:6px}
.song-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.song-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:.25s;background:var(--card);box-shadow:var(--shadow);border:1px solid transparent}
.song-item:hover{background:var(--card-hover);box-shadow:var(--shadow-lg)}
.song-item.playing{background:var(--primary-light);border-color:rgba(26,115,232,.35)}
.song-item .idx{width:26px;text-align:center;color:var(--text-light);font-size:14px;flex-shrink:0}
.song-item.playing .idx{color:var(--primary);font-weight:bold}
.song-item .info{flex:1;min-width:0;overflow:hidden}
.song-item .name{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item.playing .name{color:var(--primary);font-weight:600}
.song-item .artist{font-size:12px;color:var(--text-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item .src-tag{font-size:10px;background:var(--primary-light);padding:2px 8px;border-radius:10px;color:var(--primary-dark);flex-shrink:0}
.song-item.playing .src-tag{background:var(--primary);color:#fff}
.song-item .dl-btn{opacity:0;font-size:14px;color:var(--primary);cursor:pointer;padding:4px;transition:.2s;flex-shrink:0;background:none;border:none}
.song-item:hover .dl-btn{opacity:1}
.song-item .dl-btn:hover{transform:scale(1.25)}

/* 歌词面板 */
.lyric-panel{width:280px;background:var(--card);border-radius:16px;padding:16px;max-height:60vh;overflow-y:auto;box-shadow:var(--shadow);flex-shrink:0;position:relative}
.lyric-panel h3{font-size:14px;color:var(--text-sub);margin-bottom:10px;text-align:center;font-weight:600}
.lyric-panel .line{padding:7px 10px;font-size:13px;color:var(--text-sub);text-align:center;transition:.3s;border-radius:8px;line-height:1.5}
.lyric-panel .line.active{color:var(--primary);font-weight:700;background:var(--primary-light)}
.lyric-panel::-webkit-scrollbar{width:6px}
.lyric-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty-tip{text-align:center;color:var(--text-light);font-size:13px;padding:40px 12px;line-height:1.8}
.empty-tip button{display:inline-block;margin:6px 4px;padding:8px 16px;border-radius:20px;border:none;background:var(--primary-light);color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.empty-tip button:hover{background:var(--primary);color:#fff}

/* ===== 底部播放器（桌面：一行；手机：多行重排） ===== */
.player{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(30,90,180,.08);padding:10px 16px;display:flex;align-items:center;gap:14px;z-index:100}
/* 桌面端排列顺序 */
.cover-wrap{order:0;position:relative;width:56px;height:56px;flex-shrink:0}
.cover-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--primary-light);box-shadow:var(--shadow)}
.cover-wrap.playing img{animation:spin 20s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.player-info{order:1;min-width:0;flex:0 0 170px}
.player-info .name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info .artist{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player-mid{order:2;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.player-btns{display:flex;align-items:center;gap:16px}
.player-btns button{background:none;border:none;color:var(--text-sub);font-size:20px;cursor:pointer;transition:.2s;line-height:1;padding:4px}
.player-btns button:hover{color:var(--primary);transform:scale(1.15)}
.player-btns .play-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1a73e8,#4285f4);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(26,115,232,.35)}
.player-btns .play-btn:hover{transform:scale(1.08);color:#fff}
.progress{display:flex;align-items:center;gap:10px;width:100%}
.progress span{font-size:11px;color:var(--text-light);white-space:nowrap;min-width:32px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer;box-shadow:0 1px 4px rgba(26,115,232,.3)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer}
.player-right{order:3;display:flex;align-items:center;gap:10px;flex-shrink:0}
.player-right select{background:var(--primary-light);color:var(--primary-dark);border:none;border-radius:8px;padding:5px 8px;font-size:12px;outline:none;cursor:pointer;font-weight:600}
.volume-bar{width:70px}
.embed-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);cursor:pointer;white-space:nowrap}
.embed-label input{accent-color:var(--primary);cursor:pointer;width:15px;height:15px}
.player-right .dl-bottom{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;color:var(--primary)}
.player-right .dl-bottom:hover{transform:scale(1.15)}
/* 手机端专用按钮（默认隐藏） */
.lyric-btn,.mobile-download{display:none}

/* 全屏歌词弹层（手机端） */
.lyric-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column;padding:20px 16px 30px}
.lyric-overlay.show{display:flex}
.lyric-overlay-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lyric-overlay-header .overlay-title{font-size:17px;font-weight:700;color:var(--primary)}
.lyric-overlay-header button{background:var(--primary-light);border:none;width:36px;height:36px;border-radius:50%;color:var(--primary);font-size:16px;cursor:pointer}
.lyric-overlay-body{flex:1;overflow-y:auto;text-align:center}
.lyric-overlay-body::-webkit-scrollbar{width:6px}
.lyric-overlay-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.lyric-overlay-body .line{padding:12px 8px;font-size:15px;color:var(--text-sub);line-height:1.6;border-radius:10px;transition:.25s}
.lyric-overlay-body .line.active{color:var(--primary);font-weight:700;background:var(--primary-light)}

/* ===== 手机端适配 ===== */
@media(max-width:768px){
  .lyric-panel{display:none}
  .song-list{max-height:calc(100vh - 360px)}
  header h1{font-size:24px}
  /* 搜索栏：输入框一行，下拉+按钮一行 */
  .search-bar button{flex:1}
  .search-bar select{flex:0 0 auto}

  /* 播放条：多行布局 */
  .player{flex-wrap:wrap;gap:8px 10px;padding:10px 12px;align-items:center}
  /* 第一行：控制按钮（含歌词/下载） */
  .player-mid{order:0;flex:0 0 100%;flex-direction:column;gap:4px}
  .player-btns{justify-content:center;gap:14px;width:100%}
  .player-btns .lyric-btn{display:flex;align-items:center;color:var(--primary);font-size:18px}
  .player-btns .mobile-download{display:flex;align-items:center;color:var(--primary);font-size:18px}
  /* 第二行：封面 + 歌名 + 选项 */
  .cover-wrap{order:1;width:46px;height:46px}
  .player-info{order:2;flex:1;flex-basis:0}
  .player-right{order:3;gap:8px}
  .player-right .volume-bar{display:none}
  .player-right .dl-bottom{display:none}
  .embed-label{font-size:11px}
  .player-right select{font-size:11px;padding:4px 6px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🎵 云音乐播放器</h1>
    <div class="search-bar">
      <input id="searchInput" placeholder="搜索歌曲 / 歌手 / 专辑..." onkeydown="if(event.key==='Enter')search()">
      <select id="sourceSelect">
        <optgroup label="✅ 稳定源（推荐）">
          <option value="netease">网易云</option>
          <option value="joox">Joox（港台）</option>
          <option value="bilibili">B站</option>
        </optgroup>
        <optgroup label="⚠️ 搜索可用（播放可能失败）">
          <option value="kuwo">酷我</option>
        </optgroup>
        <optgroup label="❌ 暂未开放">
          <option value="tencent" disabled>腾讯（未开放）</option>
          <option value="tidal" disabled>Tidal（未开放）</option>
          <option value="qobuz" disabled>Qobuz（未开放）</option>
          <option value="apple" disabled>Apple（未开放）</option>
          <option value="ytmusic" disabled>YTMusic（未开放）</option>
          <option value="spotify" disabled>Spotify（未开放）</option>
        </optgroup>
      </select>
      <button onclick="search()">🔍 搜索</button>
    </div>
  </header>

  <div class="main">
    <div class="song-list" id="songList">
      <div class="empty-tip">输入关键词开始搜索吧~<br><span style="font-size:12px">💡 搜不到就换源：网易云有版权下架+风控，<br>Joox/酷我 有港台歌单，B站兜底</span></div>
    </div>
    <div class="lyric-panel" id="lyricPanel">
      <h3>📜 歌词</h3>
      <div id="lyricContent"><div class="empty-tip">播放后显示歌词</div></div>
    </div>
  </div>
</div>

<!-- 手机端全屏歌词弹层 -->
<div class="lyric-overlay" id="lyricOverlay">
  <div class="lyric-overlay-header">
    <span class="overlay-title">📜 歌词</span>
    <button onclick="closeLyric()">✕</button>
  </div>
  <div class="lyric-overlay-body" id="lyricOverlayBody"><div class="empty-tip">播放后显示歌词</div></div>
</div>

<footer class="player">
  <!-- 第一行（手机）：控制按钮组 -->
  <div class="player-mid">
    <div class="player-btns">
      <button onclick="prevSong()" title="上一首">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextSong()" title="下一首">⏭</button>
      <button class="lyric-btn" onclick="openLyric()" title="歌词">📜</button>
      <button class="mobile-download" onclick="downloadSong(currentIndex)" title="下载">⬇️</button>
    </div>
    <div class="progress">
      <span id="curTime">0:00</span>
      <input type="range" id="progressBar" value="0" max="100" oninput="seekTo(this.value)">
      <span id="durTime">0:00</span>
    </div>
  </div>

  <!-- 桌面端：封面 + 歌名 + 右侧选项 -->
  <div class="cover-wrap" id="coverWrap">
    <img id="coverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23dbe4f0'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle'%3E🎵%3C/text%3E%3C/svg%3E" alt="cover">
  </div>
  <div class="player-info">
    <div class="name" id="songName">未播放</div>
    <div class="artist" id="songArtist">—</div>
  </div>
  <div class="player-right">
    <label class="embed-label" title="下载时把封面、歌词、歌名信息写入MP3">
      <input type="checkbox" id="embedCheck" checked> 内嵌
    </label>
    <select id="brSelect" title="音质">
      <option value="128">128k</option>
      <option value="320" selected>320k</option>
      <option value="740">无损</option>
    </select>
    <input type="range" class="volume-bar" id="volumeBar" min="0" max="100" value="80" oninput="setVolume(this.value)">
    <button class="dl-bottom" onclick="downloadSong(currentIndex)" title="下载当前歌曲">⬇️</button>
  </div>
</footer>

<script>
const API = 'https://music-api.gdstudio.xyz/api.php';
const SOURCE_NAMES = {netease:'网易云', joox:'Joox', bilibili:'B站', kuwo:'酷我', tencent:'腾讯', tidal:'Tidal', qobuz:'Qobuz', apple:'Apple', ytmusic:'YTMusic', spotify:'Spotify'};
let playlist = [], currentIndex = -1, lyricData = [], currentLyricIdx = -1;
const audio = new Audio();
audio.volume = 0.8;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ===== 搜索（带自动重试） ===== */
async function search(){
  const name = document.getElementById('searchInput').value.trim();
  if(!name) return alert('请输入搜索关键词');
  const source = document.getElementById('sourceSelect').value;
  const list = document.getElementById('songList');
  list.innerHTML = '<div class="empty-tip">⏳ 搜索中...</div>';

  let data = null;
  for(let attempt = 1; attempt <= 3; attempt++){
    try{
      const res = await fetch(`${API}?types=search&source=${source}&name=${encodeURIComponent(name)}&count=20&pages=1`);
      data = await res.json();
      if(Array.isArray(data) && data.length > 0) break;
      if(attempt < 3){
        list.innerHTML = `<div class="empty-tip">⏳ ${SOURCE_NAMES[source]||source}源返回空结果，自动重试中 (${attempt}/2)...</div>`;
        await sleep(1500 * attempt);
      }
    }catch(e){
      if(attempt < 3){
        list.innerHTML = '<div class="empty-tip">⏳ 请求失败，自动重试中...</div>';
        await sleep(1500 * attempt);
      }
      data = null;
    }
  }

  if(Array.isArray(data) && data.length > 0){
    playlist = data;
    renderList();
  }else{
    const srcName = SOURCE_NAMES[source]||source;
    list.innerHTML = `
      <div class="empty-tip">
        😕 在【${srcName}】没搜到「${escapeHtml(name)}」<br>
        ${source === 'netease' ? '网易云源被风控时会返回空结果，稍等1-2分钟自动恢复' : '可能版权下架或该源未收录'}<br>
        试试换源搜索 👇
        <br>
        <button onclick="quickSwitch('joox')">🎵 Joox搜</button>
        <button onclick="quickSwitch('bilibili')">🎬 B站搜</button>
        <button onclick="quickSwitch('netease')">🔄 重试网易云</button>
      </div>`;
  }
}

function quickSwitch(src){
  document.getElementById('sourceSelect').value = src;
  search();
}

function renderList(){
  const list = document.getElementById('songList');
  list.innerHTML = '';
  playlist.forEach((song,i)=>{
    const item = document.createElement('div');
    item.className = 'song-item' + (i === currentIndex ? ' playing' : '');
    item.innerHTML = `
      <span class="idx">${i === currentIndex ? '▶' : i+1}</span>
      <div class="info">
        <div class="name">${escapeHtml(song.name)}</div>
        <div class="artist">${escapeHtml((song.artist||[]).join(' / ') || '未知歌手')} · ${escapeHtml(song.album||'')}</div>
      </div>
      <span class="src-tag">${song.source}</span>
      <button class="dl-btn" title="下载" onclick="event.stopPropagation();downloadSong(${i})">⬇️</button>`;
    item.onclick = ()=>playSong(i);
    list.appendChild(item);
  });
}

/* ===== 播放 ===== */
async function playSong(index){
  if(index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const song = playlist[index];
  const br = document.getElementById('brSelect').value;
  document.getElementById('songName').textContent = song.name;
  document.getElementById('songArtist').textContent = (song.artist||[]).join(' / ') || '未知歌手';
  renderList();

  try{
    const res = await fetch(`${API}?types=url&source=${song.source}&id=${encodeURIComponent(song.id)}&br=${br}`);
    const data = await res.json();
    if(!data.url) throw new Error('no url');
    audio.src = data.url;
    audio.play().catch(()=>alert('播放失败，可能是音频链接失效，换音质或音乐源试试'));
  }catch(e){
    alert(`播放失败（${SOURCE_NAMES[song.source]||song.source}源可能未开放或链接失效），换个音乐源试试`);
  }

  loadCover(song);
  loadLyric(song);
}

async function loadCover(song){
  const img = document.getElementById('coverImg');
  const url = await getCoverUrl(song);
  if(url) img.src = url;
}

async function getCoverUrl(song){
  if(typeof song.pic_id === 'string' && (song.pic_id.startsWith('http') || song.pic_id.startsWith('//'))){
    return song.pic_id.startsWith('//') ? 'https:' + song.pic_id : song.pic_id;
  }
  if(!song.pic_id) return '';
  try{
    const res = await fetch(`${API}?types=pic&source=${song.source}&id=${encodeURIComponent(song.pic_id)}&size=300`);
    const data = await res.json();
    return data.url || '';
  }catch(e){ return ''; }
}

async function loadLyric(song){
  lyricData = [];
  currentLyricIdx = -1;
  document.getElementById('lyricPanel').scrollTop = 0;
  document.getElementById('lyricOverlayBody').scrollTop = 0;
  document.getElementById('lyricContent').innerHTML = '<div class="empty-tip">加载歌词中...</div>';
  document.getElementById('lyricOverlayBody').innerHTML = '<div class="empty-tip">加载歌词中...</div>';
  try{
    const res = await fetch(`${API}?types=lyric&source=${song.source}&id=${encodeURIComponent(song.lyric_id||song.id)}`);
    const data = await res.json();
    if(!data.lyric){
      document.getElementById('lyricContent').innerHTML = '<div class="empty-tip">暂无歌词</div>';
      document.getElementById('lyricOverlayBody').innerHTML = '<div class="empty-tip">暂无歌词</div>';
      return;
    }
    lyricData = parseLRC(data.lyric);
    const sideHtml = lyricData.map((l,i)=>`<div class="line" id="lyr-${i}">${escapeHtml(l.text)||'&nbsp;'}</div>`).join('');
    const overlayHtml = lyricData.map((l,i)=>`<div class="line" id="olyr-${i}">${escapeHtml(l.text)||'&nbsp;'}</div>`).join('');
    document.getElementById('lyricContent').innerHTML = sideHtml || '<div class="empty-tip">暂无歌词</div>';
    document.getElementById('lyricOverlayBody').innerHTML = overlayHtml || '<div class="empty-tip">暂无歌词</div>';
  }catch(e){
    document.getElementById('lyricContent').innerHTML = '<div class="empty-tip">暂无歌词</div>';
    document.getElementById('lyricOverlayBody').innerHTML = '<div class="empty-tip">暂无歌词</div>';
  }
}

function parseLRC(lrc){
  const lines = lrc.split('\n'), result = [];
  for(const line of lines){
    const m = line.match(/\[(\d{1,2}):(\d{1,2})[.:](\d{1,3})\](.*)/);
    if(m){
      const time = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3].padEnd(3,'0'))/1000;
      result.push({time, text:m[4].trim()});
    }
  }
  return result.sort((a,b)=>a.time-b.time);
}

/* ===== 手机端歌词弹层 ===== */
function openLyric(){
  document.getElementById('lyricOverlay').classList.add('show');
}
function closeLyric(){
  document.getElementById('lyricOverlay').classList.remove('show');
}

/* ===== 下载（支持内嵌标签） ===== */
async function downloadSong(index){
  if(index < 0 || index >= playlist.length) return alert('请先搜索并选择一首歌');
  const song = playlist[index];
  const br = document.getElementById('brSelect').value;
  const embed = document.getElementById('embedCheck').checked;
  try{
    const res = await fetch(`${API}?types=url&source=${song.source}&id=${encodeURIComponent(song.id)}&br=${br}`);
    const data = await res.json();
    if(!data.url) throw new Error('no url');
    const filename = sanitize(`${song.name} - ${(song.artist||[]).join('、')}.mp3`);

    const isMp3 = /\.mp3(\?|$)/i.test(data.url);
    if(embed && isMp3){
      const ok = await embedAndDownload(song, data.url, filename);
      if(ok) return;
    }
    downloadUrl(data.url, filename);
  }catch(e){
    alert('获取下载链接失败，该源可能未开放，换个音乐源试试');
  }
}

async function embedAndDownload(song, audioUrl, filename){
  try{
    let mod = null;
    const cdns = [
      'https://cdn.jsdelivr.net/npm/browser-id3-writer@6.4.0/dist/browser-id3-writer.mjs',
      'https://unpkg.com/browser-id3-writer@6.4.0/dist/browser-id3-writer.mjs'
    ];
    for(const cdn of cdns){
      try{ mod = await import(cdn); if(mod && mod.ID3Writer) break; }catch(e){}
    }
    if(!mod || !mod.ID3Writer) return false;

    const audioRes = await fetch(audioUrl);
    if(!audioRes.ok) return false;
    const audioBuffer = await audioRes.arrayBuffer();

    const [coverBuf, lrcText] = await Promise.all([
      fetchCoverBuffer(song),
      fetchLyricText(song)
    ]);

    const writer = new mod.ID3Writer(audioBuffer);
    writer.setFrame('TIT2', song.name);
    if(song.artist && song.artist.length) writer.setFrame('TPE1', song.artist);
    if(song.album) writer.setFrame('TALB', song.album);
    if(lrcText){
      writer.setFrame('USLT', {language:'chi', description:'歌词', lyrics:lrcText});
      const sync = parseLRC(lrcText).map(l=>[l.text, Math.round(l.time*1000)]);
      if(sync.length) writer.setFrame('SYLT', {type:1, text:sync, timestampFormat:2, language:'chi', description:'歌词'});
    }
    if(coverBuf) writer.setFrame('APIC', {type:3, data:coverBuf, description:'Cover'});
    writer.addTag();

    saveBlob(writer.getBlob(), filename);
    return true;
  }catch(e){
    console.warn('内嵌标签失败，改为普通下载', e);
    return false;
  }
}

async function fetchCoverBuffer(song){
  try{
    const url = await getCoverUrl(song);
    if(!url) return null;
    const res = await fetch(url);
    if(!res.ok) return null;
    return await res.arrayBuffer();
  }catch(e){ return null; }
}

async function fetchLyricText(song){
  try{
    const res = await fetch(`${API}?types=lyric&source=${song.source}&id=${encodeURIComponent(song.lyric_id||song.id)}`);
    const data = await res.json();
    return data.lyric || '';
  }catch(e){ return ''; }
}

function saveBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

function sanitize(s){
  return s.replace(/[\\/:*?"<>|]/g,'').trim() || 'music.mp3';
}

async function downloadUrl(url, filename){
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    saveBlob(blob, filename);
  }catch(e){
    window.open(url, '_blank');
  }
}

/* ===== 播放控制 ===== */
function togglePlay(){
  if(!audio.src) return alert('请先搜索并选择一首歌');
  if(audio.paused) audio.play(); else audio.pause();
}
audio.addEventListener('play',()=>{
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('coverWrap').classList.add('playing');
});
audio.addEventListener('pause',()=>{
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('coverWrap').classList.remove('playing');
});
audio.addEventListener('timeupdate',()=>{
  const p = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  const bar = document.getElementById('progressBar');
  bar.value = p;
  bar.style.background = `linear-gradient(to right, var(--primary) ${p}%, var(--border) ${p}%)`;
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
  document.getElementById('durTime').textContent = fmt(audio.duration);
  highlightLyric(audio.currentTime);
});
audio.addEventListener('ended',()=>nextSong());
audio.addEventListener('error',()=>alert('音频加载失败，可能链接失效'));

function seekTo(v){ if(audio.duration) audio.currentTime = v/100*audio.duration; }
function setVolume(v){ audio.volume = v/100; }
function prevSong(){ playSong(currentIndex-1); }
function nextSong(){ playSong(currentIndex+1); }

/* 歌词高亮（桌面侧栏 + 手机弹层同步） */
function highlightLyric(t){
  let idx = -1;
  for(let i=0;i<lyricData.length;i++){
    if(t >= lyricData[i].time) idx = i; else break;
  }
  if(idx === -1 || idx === currentLyricIdx) return;
  currentLyricIdx = idx;

  const panel = document.getElementById('lyricPanel');
  panel.querySelectorAll('.line').forEach(el=>el.classList.remove('active'));
  const cur = document.getElementById('lyr-'+idx);
  if(cur){
    cur.classList.add('active');
    panel.scrollTop = Math.max(0, cur.offsetTop - panel.clientHeight/2 + cur.offsetHeight/2);
  }

  const overlay = document.getElementById('lyricOverlayBody');
  overlay.querySelectorAll('.line').forEach(el=>el.classList.remove('active'));
  const o = document.getElementById('olyr-'+idx);
  if(o){
    o.classList.add('active');
    overlay.scrollTop = Math.max(0, o.offsetTop - overlay.clientHeight/2 + o.offsetHeight/2);
  }
}

function fmt(s){
  if(!isFinite(s)) return '0:00';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
